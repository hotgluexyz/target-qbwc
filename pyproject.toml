[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "target-qbwc"
version = "0.0.1"
description = "Singer target for QuickBooks Desktop via the QuickBooks Web Connector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hotglue" }]
keywords = ["ELT", "QuickBooks", "QBWC"]
dependencies = [
    "hotglue-singer-sdk>=1.0.40",
    "hotglue-etl-exceptions>=0.1.0",
    "qbwc-common @ git+https://github.com/hotgluexyz/qbwc-common.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.0,<0.16.0",
    "tox>=4.0",
]

[project.scripts]
target-qbwc = "target_qbwc.target:TargetQbwc.cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["target_qbwc*"]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["target_qbwc"]
